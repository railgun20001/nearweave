name: 同步 Gitee 国内更新源

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 可选；同步指定的现有 GitHub Release，例如 v0.4.0
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: 已完成发布的 GitHub Release 标签
        required: false
        type: string
        default: ""
    secrets:
      GITEE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: nearweave-sync-gitee
  cancel-in-progress: false

jobs:
  sync-gitee:
    name: 单向同步代码、标签与发行版
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: 检出完整仓库历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步 Gitee
        shell: pwsh
        run: |
          ./.github/scripts/sync-gitee.ps1 `
            -Owner "railgun20001" `
            -Repository "nearweave" `
            -UpdaterRepository "nearweave-updates" `
            -MainBranch "main" `
            -ReleaseTag "$env:RELEASE_TAG"
